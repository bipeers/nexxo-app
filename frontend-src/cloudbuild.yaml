steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    dir: 'frontend-src'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/nexxo-repo/nexxo-frontend:$COMMIT_SHA', '.']

  # Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/nexxo-repo/nexxo-frontend:$COMMIT_SHA']

  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'nexxo-frontend'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/nexxo-repo/nexxo-frontend:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/nexxo-repo/nexxo-frontend:$COMMIT_SHA'
